<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Carvalho Escuro</title>
<style>
:root{--bg:#14100c;--panel:#1d1610;--line:#33261a;--oak:#94653b;--oak-hi:#c08a52;--text:#eadfce;--mute:#9a8a76;--err:#d97b66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
h1{margin:0;font:600 19px/1 "Iowan Old Style",Palatino,Georgia,serif;letter-spacing:.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.icon:active{background:var(--panel)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0 18px}
#orbwrap{width:min(78vw,52vh,360px);aspect-ratio:1;border-radius:50%;outline:none}
#orb{width:100%;height:100%;display:block;touch-action:manipulation}
#status{margin-top:10px;color:var(--oak-hi);font-size:15px;min-height:22px;text-align:center}
#hint{color:var(--mute);font-size:13px;text-align:center;min-height:20px}
#log{width:100%;max-width:520px;margin-top:14px;max-height:24vh;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:15px}
.m{padding:9px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--panel);border:1px solid var(--line)}
.a{align-self:flex-start;color:#f3e6d2}
.i{align-self:center;color:var(--mute);font-size:13px;padding:0}
footer{padding:10px 14px 14px}
form{display:flex;gap:8px;max-width:520px;margin:0 auto}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--oak)}
#send{padding:0 16px;background:var(--oak);color:#fff;border-radius:12px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a1d12;border:1px solid var(--oak);padding:10px 14px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:none}
#sheet.on{display:block}
.bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);z-index:2}
.wrap{max-width:560px;margin:0 auto;padding:6px 18px 40px}
h2{font:600 17px/1.2 "Iowan Old Style",Palatino,Georgia,serif;margin:26px 0 4px;color:var(--oak-hi)}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
label{display:block;font-size:14px;margin:12px 0 5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.row label{margin:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--oak)}
input[type=range]{padding:0;accent-color:var(--oak);border:0;background:none}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
.btn:active{border-color:var(--oak)}
textarea{min-height:110px;resize:vertical}
</style>
</head>
<body>
<header>
  <h1 id="title">Carvalho Escuro</h1>
  <button class="icon" id="gear" aria-label="Ajustes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main>
  <div id="orbwrap" role="button" tabindex="0" aria-label="Ativar ou desativar o assistente"><canvas id="orb"></canvas></div>
  <div id="status">Toque na esfera para ativar</div>
  <div id="hint"></div>
  <div id="log" aria-live="polite"></div>
</main>
<footer>
  <form id="f" autocomplete="off"><input id="txt" placeholder="Ou escreva aqui…" enterkeyhint="send"><button id="send" type="submit">Enviar</button></form>
</footer>
<div id="toast"></div>

<section id="sheet" aria-label="Ajustes">
  <div class="bar"><h1>Ajustes</h1><button class="btn" id="close" style="margin:0">Fechar</button></div>
  <div class="wrap" id="form"></div>
</section>

<script>
const $=s=>document.querySelector(s);
const PRESETS={
  groq:{baseUrl:'https://api.groq.com/openai/v1',model:'llama-3.3-70b-versatile'},
  openai:{baseUrl:'https://api.openai.com/v1',model:'gpt-4o-mini'},
  openrouter:{baseUrl:'https://openrouter.ai/api/v1',model:'meta-llama/llama-3.3-70b-instruct'},
  custom:{baseUrl:'',model:''}
};
const DEF={service:'groq',baseUrl:PRESETS.groq.baseUrl,model:PRESETS.groq.model,apiKey:'',
  system:'Você é o Carvalho Escuro, um assistente de voz estilo Jarvis. Responda em português do Brasil, de forma curta e natural (1 a 3 frases), sem markdown, sem listas e sem emojis.',
  fishKey:'',voiceId:'',speed:1,deviceVoice:true,name:'Carvalho Escuro',keepListening:true,lang:'pt-BR'};
let S;
try{S={...DEF,...JSON.parse(localStorage.getItem('ce_settings')||'{}')}}catch{S={...DEF}}
const save=()=>{try{localStorage.setItem('ce_settings',JSON.stringify(S))}catch{}};

/* ---------- UI helpers ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),4200)}
function addMsg(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;const l=$('#log');l.appendChild(d);while(l.children.length>30)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight;return d}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

/* ---------- state ---------- */
let mode='off';      // off | standby | active
let status='idle';   // idle | listening | thinking | speaking
let busy=false, idleTimer=null, hist=[];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setStatus(s){
  status=s;
  const n=S.name||'Carvalho Escuro';
  const txt={off:'Toque na esfera para ativar',
    standby:`Em espera — diga “${n}”`,
    active:'Ouvindo…'}[mode];
  $('#status').textContent = s==='thinking'?'Pensando…': s==='speaking'?'Falando…': txt;
}

/* ---------- speech recognition ---------- */
let rec=null, recWanted=false;
function startRec(){
  if(!SR){toast('Este navegador não tem reconhecimento de voz. Use o Chrome (Android) ou Safari recente.');return}
  if(rec||!recWanted||busy)return;
  const r=new SR();rec=r;
  r.lang=S.lang||'pt-BR';r.continuous=true;r.interimResults=true;
  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];const t=res[0].transcript.trim();
      if(!t)continue;
      if(res.isFinal){$('#hint').textContent='';handleHeard(t)}
      else $('#hint').textContent='… '+t;
    }
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){recWanted=false;mode='off';setStatus('idle');toast('Permita o uso do microfone nas configurações do navegador.')}
  };
  r.onend=()=>{if(rec===r)rec=null;if(recWanted&&!busy)setTimeout(startRec,300)};
  try{r.start()}catch{rec=null}
}
function stopRec(){if(rec){const r=rec;rec=null;r.onend=null;try{r.abort()}catch{}}}

function armIdle(){
  clearTimeout(idleTimer);
  if(mode==='active')idleTimer=setTimeout(()=>{if(!busy&&mode==='active'){mode='standby';setStatus('listening');addMsg('i','Voltei para o modo de espera.')}},25000);
}

function handleHeard(text){
  if(busy)return;
  if(mode==='standby'){
    const nt=norm(text),nn=norm(S.name||'Carvalho Escuro');
    const first=nn.split(' ')[0];
    let idx=nt.indexOf(nn),len=nn.length;
    if(idx<0&&first.length>=5){idx=nt.indexOf(first);len=first.length}
    if(idx<0)return;
    mode='active';armIdle();
    const rest=nt.slice(idx+len).trim();
    if(rest.length>2){addMsg('u',rest);ask(rest)}
    else{say('Pois não?')}
    return;
  }
  if(mode==='active'){
    const n=norm(text);
    if(/^(tchau|ate logo|pode parar|desativar|dispensado)/.test(n)){mode='standby';addMsg('u',text);say('Até logo.');return}
    addMsg('u',text);ask(text);
  }
}

/* ---------- brain ---------- */
async function ask(text){
  busy=true;stopRec();setStatus('thinking');clearTimeout(idleTimer);
  hist.push({role:'user',content:text});hist=hist.slice(-14);
  let reply;
  try{
    if(!S.apiKey)throw new Error('Falta a chave de API nos Ajustes.');
    const r=await fetch(S.baseUrl.replace(/\/$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},
      body:JSON.stringify({model:S.model,messages:[{role:'system',content:S.system},...hist],temperature:.7,max_tokens:300})
    });
    if(!r.ok){const b=await r.text();throw new Error(`Erro ${r.status}: ${b.slice(0,140)}`)}
    const j=await r.json();
    reply=(j.choices?.[0]?.message?.content||'').trim();
    if(!reply)throw new Error('Resposta vazia.');
    hist.push({role:'assistant',content:reply});
  }catch(err){
    toast(err.message||String(err));
    reply='Não consegui falar com o meu cérebro. Confira os ajustes.';
  }
  addMsg('a',reply);
  await speak(reply);
  after();
}
function after(){
  busy=false;
  if(mode==='active'&&!S.keepListening)mode='standby';
  if(mode!=='off'){setStatus('listening');armIdle();startRec()}else setStatus('idle');
}
async function say(t){busy=true;stopRec();addMsg('a',t);await speak(t);after()}

/* ---------- voice (Fish Audio + fallback) ---------- */
const player=new Audio();player.preload='auto';player.playsInline=true;
let actx,analyser,buf,wired=false,unlocked=false,synthSpeaking=false;
function wireAudio(){
  if(wired)return;wired=true;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(player);
    analyser=actx.createAnalyser();analyser.fftSize=512;buf=new Uint8Array(analyser.fftSize);
    src.connect(analyser);analyser.connect(actx.destination);
  }catch{analyser=null}
}
function unlockAudio(){
  if(unlocked)return;unlocked=true;wireAudio();
  try{actx&&actx.resume()}catch{}
  player.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=';
  player.play().catch(()=>{});
}
function clean(t){return t.replace(/[*_#`>~]/g,'').replace(/\s+/g,' ').trim()}
async function speak(raw){
  const text=clean(raw);if(!text)return;
  setStatus('speaking');
  if(S.fishKey&&S.voiceId){
    try{
      const r=await fetch('https://api.fish.audio/v1/tts',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.fishKey,'model':'s1'},
        body:JSON.stringify({text,reference_id:S.voiceId,format:'mp3',latency:'balanced',prosody:{speed:Number(S.speed)||1}})
      });
      if(!r.ok)throw new Error(`Fish Audio ${r.status}`);
      const blob=await r.blob();
      await playBlob(blob);return;
    }catch(err){
      toast((err.message||'Falha no Fish Audio')+(S.deviceVoice?' — usando a voz do aparelho.':''));
      if(!S.deviceVoice)return;
    }
  }
  await speakDevice(text);
}
function playBlob(blob){
  return new Promise((res)=>{
    wireAudio();try{actx&&actx.resume()}catch{}
    const url=URL.createObjectURL(blob);
    const done=()=>{player.onended=player.onerror=null;URL.revokeObjectURL(url);res()};
    player.onended=done;player.onerror=done;
    player.src=url;player.play().catch(done);
  });
}
function speakDevice(text){
  return new Promise(res=>{
    if(!('speechSynthesis' in window))return res();
    const u=new SpeechSynthesisUtterance(text);u.lang=S.lang||'pt-BR';u.rate=Number(S.speed)||1;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith((S.lang||'pt-BR').slice(0,2).toLowerCase()));
    if(v)u.voice=v;
    synthSpeaking=true;
    u.onend=u.onerror=()=>{synthSpeaking=false;res()};
    speechSynthesis.cancel();speechSynthesis.speak(u);
  });
}
function level(){
  if(analyser&&!player.paused&&!player.ended){
    analyser.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}
    return Math.min(1,Math.sqrt(s/buf.length)*4);
  }
  return synthSpeaking?.3+.25*Math.abs(Math.sin(performance.now()/110)):.2;
}

/* ---------- wake lock ---------- */
let wl=null;
async function lock(){try{if('wakeLock' in navigator&&mode!=='off')wl=await navigator.wakeLock.request('screen')}catch{}}
function unlock(){try{wl&&wl.release()}catch{}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mode!=='off')lock()});

/* ---------- on/off ---------- */
async function toggle(){
  unlockAudio();
  if(mode==='off'){
    if(SR){
      try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}
      catch{toast('Permita o uso do microfone para ativar.');return}
    }
    mode='active';recWanted=true;busy=false;setStatus('listening');lock();armIdle();startRec();
    if(!S.apiKey)toast('Abra os Ajustes e coloque a chave da API do cérebro.');
  }else{
    mode='off';recWanted=false;busy=false;stopRec();clearTimeout(idleTimer);
    try{speechSynthesis.cancel()}catch{};player.pause();unlock();setStatus('idle');$('#hint').textContent='';
  }
}
$('#orbwrap').addEventListener('click',toggle);
$('#orbwrap').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
$('#f').addEventListener('submit',e=>{
  e.preventDefault();unlockAudio();
  const t=$('#txt').value.trim();if(!t||busy)return;$('#txt').value='';
  if(mode==='off'){mode='active';recWanted=SR?true:false;lock()}
  addMsg('u',t);ask(t);
});

/* ---------- orb ---------- */
const cv=$('#orb'),cx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){const d=devicePixelRatio||1,w=cv.clientWidth;cv.width=cv.height=Math.round(w*d);cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);
let amp=0;
function frame(ts){
  const t=ts/1000,w=cv.clientWidth,c=w/2;cx.clearRect(0,0,w,w);
  const k=reduce?.35:1;
  let target=status==='speaking'?level():status==='listening'?(mode==='active'?.28+.1*Math.sin(t*3):.1+.04*Math.sin(t*1.3)):status==='thinking'?.2:(mode==='off'?.05:.1);
  amp+=(target-amp)*.14;
  const base=w*.27*(1+amp*.22*k);
  let g=cx.createRadialGradient(c,c,base*.5,c,c,base*2.05);
  g.addColorStop(0,`rgba(148,101,59,${.28+amp*.5})`);g.addColorStop(1,'rgba(148,101,59,0)');
  cx.fillStyle=g;cx.fillRect(0,0,w,w);
  cx.beginPath();
  const N=110;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const n=Math.sin(a*3+t*1.3)*.5+Math.sin(a*5-t*1.9)*.3+Math.sin(a*2+t*.7)*.4;
    const r=base*(1+(.03+amp*.2)*n*k);
    const x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;
    i?cx.lineTo(x,y):cx.moveTo(x,y);
  }
  cx.closePath();
  g=cx.createRadialGradient(c-base*.32,c-base*.38,base*.05,c,c,base*1.15);
  g.addColorStop(0,'#b87f4b');g.addColorStop(.45,'#6b4326');g.addColorStop(1,'#2e1c0d');
  cx.fillStyle=g;cx.fill();
  cx.lineWidth=1.5;cx.strokeStyle='rgba(192,138,82,.35)';cx.stroke();
  if(status==='thinking'){
    cx.beginPath();cx.arc(c,c,base*1.22,t*2.4,t*2.4+Math.PI*.7);
    cx.lineWidth=3;cx.lineCap='round';cx.strokeStyle='#c08a52';cx.stroke();
  }
  requestAnimationFrame(frame);
}

/* ---------- settings ---------- */
const FIELDS=[
  {h:'Cérebro',s:'Qualquer serviço compatível com a API da OpenAI.'},
  {k:'service',l:'Serviço',t:'select',o:[['groq','Groq'],['openai','OpenAI'],['openrouter','OpenRouter'],['custom','Personalizado']]},
  {k:'baseUrl',l:'Endereço da API',t:'text'},
  {k:'model',l:'Modelo',t:'text'},
  {k:'apiKey',l:'Chave da API',t:'password'},
  {k:'system',l:'Personalidade',t:'area'},
  {h:'Voz',s:'Fish Audio. Sem chave ou ID, usa a voz do aparelho.'},
  {k:'fishKey',l:'Chave do Fish Audio',t:'password'},
  {k:'voiceId',l:'ID da voz (reference ID)',t:'text'},
  {k:'speed',l:'Velocidade da fala',t:'range'},
  {k:'deviceVoice',l:'Usar a voz do aparelho se o Fish Audio falhar',t:'check'},
  {btn:'Testar voz'},
  {h:'Ativação'},
  {k:'name',l:'Nome de ativação',t:'text'},
  {k:'keepListening',l:'Continuar ouvindo depois de responder',t:'check'},
  {k:'lang',l:'Idioma da escuta',t:'select',o:[['pt-BR','Português (Brasil)'],['pt-PT','Português (Portugal)'],['en-US','English (US)'],['es-ES','Español']]},
];
function buildForm(){
  const f=$('#form');f.innerHTML='';
  for(const d of FIELDS){
    if(d.h){const h=document.createElement('h2');h.textContent=d.h;f.appendChild(h);if(d.s){const p=document.createElement('p');p.className='sub';p.textContent=d.s;f.appendChild(p)}continue}
    if(d.btn){const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=d.btn;b.onclick=async()=>{unlockAudio();await speak('Olá. Aqui é o '+(S.name||'Carvalho Escuro')+'. A voz está funcionando.');setStatus(mode==='off'?'idle':'listening')};f.appendChild(b);continue}
    let el,wrap=document.createElement('div');
    if(d.t==='check'){
      wrap.className='row';const l=document.createElement('label');l.textContent=d.l;l.htmlFor='f_'+d.k;
      el=document.createElement('input');el.type='checkbox';el.id='f_'+d.k;el.checked=!!S[d.k];
      el.onchange=()=>{S[d.k]=el.checked;save()};wrap.append(l,el);
    }else{
      const l=document.createElement('label');l.textContent=d.l;l.htmlFor='f_'+d.k;wrap.appendChild(l);
      if(d.t==='select'){el=document.createElement('select');for(const [v,n] of d.o){const o=document.createElement('option');o.value=v;o.textContent=n;el.appendChild(o)}el.value=S[d.k]}
      else if(d.t==='area'){el=document.createElement('textarea');el.value=S[d.k]}
      else if(d.t==='range'){el=document.createElement('input');el.type='range';el.min=.5;el.max=2;el.step=.05;el.value=S[d.k];l.textContent=d.l+': '+Number(S[d.k]).toFixed(2)+'×'}
      else{el=document.createElement('input');el.type=d.t;el.value=S[d.k];el.autocomplete='off';el.autocapitalize='off';el.spellcheck=false}
      el.id='f_'+d.k;
      el.oninput=el.onchange=()=>{
        S[d.k]=d.t==='range'?Number(el.value):el.value;
        if(d.t==='range')l.textContent=d.l+': '+Number(el.value).toFixed(2)+'×';
        if(d.k==='service'){const p=PRESETS[el.value];if(el.value!=='custom'){S.baseUrl=p.baseUrl;S.model=p.model;$('#f_baseUrl').value=S.baseUrl;$('#f_model').value=S.model}}
        if(d.k==='name'){$('#title').textContent=S.name||'Carvalho Escuro';document.title=S.name||'Carvalho Escuro'}
        save();
      };
      wrap.appendChild(el);
    }
    f.appendChild(wrap);
  }
}
$('#gear').onclick=()=>{buildForm();$('#sheet').classList.add('on')};
$('#close').onclick=()=>{$('#sheet').classList.remove('on');$('#title').textContent=S.name||'Carvalho Escuro';if(mode!=='off'){stopRec();startRec()}setStatus(status==='speaking'||status==='thinking'?status:(mode==='off'?'idle':'listening'))};

/* ---------- boot ---------- */
$('#title').textContent=S.name||'Carvalho Escuro';
fit();setStatus('idle');requestAnimationFrame(frame);
if(!SR)$('#hint').textContent='Sem reconhecimento de voz neste navegador — use o campo de texto.';
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
</body>
</html>
